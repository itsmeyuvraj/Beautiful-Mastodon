[package]
name = "mastodon-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3.77"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlImageElement",
    "HtmlButtonElement",
    "HtmlSelectElement",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "InputEvent",
    "Storage",
    "Response",
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCredentials",
    "Headers",
    "File",
    "FileList",
    "FormData",
    "Blob",
    "Url",
    "UrlSearchParams",
    "Location",
    "History",
    "CustomEvent",
    "MessageEvent",
    "DomTokenList",
    "MediaQueryList",
    "Node",
    "NodeList",
    "console",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
]
